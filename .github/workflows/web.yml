name: Web Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck || echo "::warning::typecheck 有告警，不阻断构建"

      - name: Build web bundle
        run: npm run build:web

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: stland-web-dist
          path: dist
          retention-days: 7

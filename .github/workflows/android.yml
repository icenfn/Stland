name: Android APK (arm64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于 APK 文件名）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # 复用 runner 预装的 Android SDK。
      # 不用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 而该包在 cmdline-tools 16 已被移除，会以
      # "Warning: Failed to find package 'tools'" 直接失败。
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android toolchain
        id: sdk
        run: |
          SDK="$ANDROID_HOME"
          echo "SDK root: $SDK"
          NDK_DIR=""
          [ -d "$SDK/ndk" ] && NDK_DIR=$(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ] && [ -d "$SDK/ndk-bundle" ]; then NDK_DIR="$SDK/ndk-bundle/"; fi
          if [ -z "$NDK_DIR" ]; then
            echo "未发现预装 NDK，安装 27.x"
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
            NDK_DIR="$SDK/ndk/27.0.12077973/"
          fi
          NDK_DIR="${NDK_DIR%/}"
          BT_DIR=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          BT_DIR="${BT_DIR%/}"
          echo "NDK: $NDK_DIR"
          echo "build-tools: $BT_DIR"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" --version | head -1
          "$BT_DIR/zipalign" 2>&1 | head -1 || true
          "$BT_DIR/apksigner" --version
          {
            echo "ndk_home=$NDK_DIR"
            echo "build_tools=$BT_DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@^2

      - name: Build web assets
        run: npm run build:web

      # 顺序很关键：必须先 init。
      # tauri android init 以 gen/android 是否存在判断「工程已初始化」，
      # 若提前创建该目录，init 会跳过脚手架，随后因
      # app/src/main/java/<identifier> 不存在而报错退出。
      - name: Init Android project
        env:
          NDK_HOME: ${{ steps.sdk.outputs.ndk_home }}
        run: npx tauri android init --ci

      - name: Verify Android scaffold
        run: |
          test -d "src-tauri/gen/android/app/src/main/java/ai/stland/app" \
            || { echo "::error::Android 脚手架未生成"; find src-tauri/gen -maxdepth 6 -type d | head -30; exit 1; }
          ls src-tauri/gen/android

      - name: Build arm64 APK
        env:
          NDK_HOME: ${{ steps.sdk.outputs.ndk_home }}
        run: |
          # android build 没有 --ci 选项（仅 init 有），误传会报
          # "unexpected argument '--ci' found"。
          # 此步产出的是 debug 签名的 APK，随后由 apksigner 用发布密钥重签。
          npx tauri android build --apk --target aarch64

      - name: Align and sign APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BUILD_TOOLS: ${{ steps.sdk.outputs.build_tools }}
          VER: ${{ github.event.inputs.version || '1.0.0' }}
        run: |
          set -euo pipefail
          SRC=$(find src-tauri/gen/android -path "*release*" -name "*.apk" -type f | head -1)
          if [ -z "$SRC" ]; then SRC=$(find src-tauri/gen/android -name "*.apk" -type f | head -1); fi
          if [ -z "$SRC" ]; then echo "::error::未找到 APK 产物"; find src-tauri/gen/android -name "*.apk" | head; exit 1; fi
          echo "源 APK: $SRC"

          mkdir -p dist-apk
          SUFFIX=""
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，产物保持 debug 签名（不可对外分发）"
            SUFFIX="-debug"
            cp "$SRC" "dist-apk/Stland-${VER}-arm64${SUFFIX}-.apk"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            # 之所以在 APK 层面重签而不是改 Gradle 脚本：
            # app/build.gradle.kts 由 tauri android init 生成，文本结构随 CLI 版本变化，
            # 文本注入脆弱且已实测插入位置错误导致 Kotlin 脚本编译失败。
            # zipalign + apksigner 是 Android 官方的确定性流程，与模板无关。
            "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$RUNNER_TEMP/signed.apk" \
              "$RUNNER_TEMP/aligned.apk"
            cp "$RUNNER_TEMP/signed.apk" "dist-apk/Stland-${VER}-arm64-.apk"
          fi

          NAME="Stland-${VER}-arm64${SUFFIX}-$(echo $GITHUB_SHA | cut -c1-7).apk"
          mv "dist-apk/Stland-${VER}-arm64${SUFFIX}-.apk" "dist-apk/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=dist-apk/$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk

          echo "=== 证书核验 ==="
          "$BUILD_TOOLS/apksigner" verify --print-certs "dist-apk/$NAME" | head -8
          echo "=== 文件类型 ==="
          file "dist-apk/$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stland-arm64-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: Stland ${{ github.ref_name }}
          draft: false
          generate_release_notes: true

name: Android APK (arm64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（用于 APK 文件名与 versionName）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64

      - name: Install frontend deps
        run: npm ci || npm install

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@^2

      - name: Build web assets
        run: npm run build:web

      - name: Inject signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，将以 debug 签名构建（不可用于分发）"
            exit 0
          fi
          mkdir -p src-tauri/gen/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "签名配置已写入"

      - name: Init Android project
        if: ${{ hashFiles('src-tauri/gen/android/app/build.gradle.kts') == '' }}
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: npx tauri android init --ci

      - name: Apply signing config to gradle
        if: ${{ hashFiles('src-tauri/gen/android/keystore.properties') != '' }}
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("src-tauri/gen/android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          if "keystore.properties" in s:
              print("已存在签名配置，跳过")
          else:
              loader = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystorePropertiesFile = rootProject.file("keystore.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
              # 在文件首个 import 之前插入读取逻辑
              idx = s.find("import ")
              s = s[:idx] + loader.strip() + "\n\n" + s[idx:]
              signing = '''
              signingConfigs {
                  create("release") {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }
              '''
              s = s.replace("buildTypes {", signing + "\n    buildTypes {", 1)
              s = s.replace("getByName(\"release\") {", "getByName(\"release\") {\n            signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName(\"release\") else signingConfigs.getByName(\"debug\")", 1)
              p.write_text(s, encoding="utf-8")
              print("gradle 签名配置已注入")
          PY

      - name: Build arm64 APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          TAURI_ANDROID_TARGET: aarch64
        run: |
          npx tauri android build --apk --target aarch64 --ci || npx tauri android build --apk --target aarch64

      - name: Collect APK
        id: apk
        run: |
          VER="${{ github.event.inputs.version || '1.0.0' }}"
          APK=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "::error::未找到 APK 产物"; exit 1; fi
          NAME="Stland-${VER}-arm64-$(echo $GITHUB_SHA | cut -c1-7).apk"
          mkdir -p dist-apk
          cp "$APK" "dist-apk/$NAME"
          echo "path=dist-apk/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist-apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stland-arm64-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: Stland ${{ github.ref_name }}
          draft: false
          generate_release_notes: true

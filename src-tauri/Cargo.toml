[package]
name = "stland"
version = "1.0.0"
description = "Stland 股岛 —— 自包含股票交易系统客户端"
authors = ["Stland"]
edition = "2021"

[lib]
name = "stland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# 通过 JNI 读取 Android 状态栏/导航栏尺寸，实现沉浸式布局
jni = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

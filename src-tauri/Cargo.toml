[package]
name = "stland"
version = "1.0.0"
description = "Stland 股岛 —— 自包含股票交易系统客户端"
authors = ["Stland"]
edition = "2021"

[lib]
name = "stland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
# 原生 HTTP 通道。Android WebView 的页面源是 https://tauri.localhost，
# 向 http:// 发请求属于混合内容会被拦；由 Rust 侧发请求可绕开该限制，
# 明文放行则改由 network_security_config.xml 按主机白名单精确管控。
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# 通过 JNI 读取 Android 状态栏/导航栏尺寸，实现沉浸式布局
jni = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

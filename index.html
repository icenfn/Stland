<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面延伸到状态栏与手势条下方，配合安全区变量实现沉浸式 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="format-detection" content="telephone=no" />
    <title>Stland 股岛</title>
    <style>
      /* 启动占位：Vue 挂载时会把 #app 的内容整体替换掉。
         有它才不会出现「白屏/黑屏一闪」——WebView 创建到首屏渲染之间
         必然有一段空白，这里用同色底 + 品牌字填满。
         注意：纯 CSS 实现，不使用内联脚本（CSP script-src 'self' 会拦截）。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f16;
      }
      #app {
        min-height: 100%;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(120% 80% at 50% 0%, #16233a 0%, #0b0f16 62%);
        color: #eaf0f8;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot-mark {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .boot-sub {
        font-size: 12px;
        color: #6b7789;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .boot-bar {
        width: 96px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #e8383d;
        animation: bootslide 1.1s ease-in-out infinite;
      }
      @keyframes bootslide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-mark">股岛</div>
        <div class="boot-sub">Stland</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
